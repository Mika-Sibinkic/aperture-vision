# Aperture Bridge — Cloudflare Tunnel ingress rule for Dell G7.
#
# Insert this entry into your existing Dell cloudflared config at
# /etc/cloudflared/config.yml (or ~/.cloudflared/config.yml, depending on
# your NSOS install). Order matters — keep it BEFORE the catch-all
# `- service: http_status:404` line.
#
# Your existing tunnel (per NSOS DELL-SETUP.md):
#   Tunnel name:  nsos-server
#   Tunnel UUID:  <cloudflare-tunnel-id>
#   Domain:       example.com
#   Existing ingress:  ssh.example.com  ->  ssh://localhost:22
#
# After editing config.yml, run (once):
#   cloudflared tunnel route dns nsos-server bridge.example.com
# Then restart:
#   sudo systemctl restart cloudflared

  - hostname: bridge.example.com
    service: http://localhost:8002
    originRequest:
      connectTimeout: 10s
      noHappyEyeballs: true
