# Add this ingress rule to your existing Dell G7 cloudflared config.yml
# (typically /etc/cloudflared/config.yml). Order matters — put this BEFORE
# your catch-all 404 rule.
#
# After editing:
#     sudo systemctl restart cloudflared
#     cloudflared tunnel route dns <TUNNEL_NAME> aperture-bridge.<YOUR_DOMAIN>

  - hostname: aperture-bridge.YOUR_DOMAIN.com
    service: http://localhost:8002
    originRequest:
      connectTimeout: 10s
      noHappyEyeballs: true
