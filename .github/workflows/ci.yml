name: ci

on:
  push:
  pull_request:

jobs:
  training-loop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r training-loop/requirements.txt pytest
      - run: python -m pytest -q training-loop
