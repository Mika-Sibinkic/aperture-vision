name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r demo/requirements.txt
      - run: python -m pytest -q demo
      - name: n8n workflow JSON parses and carries no pinData (captured requests)
        run: python -c "import glob, json; bad = [f for f in glob.glob('n8n/*.json') if json.load(open(f)).get('pinData')]; assert not bad, bad"
      - run: node scripts/test_farmbrite_match.js
      - run: node scripts/test_parse_vision.js

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=critical
      - run: bash scripts/check-ipad-script.sh
