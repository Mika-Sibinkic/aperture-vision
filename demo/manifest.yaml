# Aperture demo test set.
#
# Each image entry is a single (image, ground-truth-weight-in-lb) pair.
# The harness loads each image, runs the deterministic ChArUco preprocessor,
# calls the vision provider, and computes residual vs. `true_weight_lbs`.
#
# To add an image:
#   1. drop the file into demo/test-images/
#   2. weigh the item, record true_weight_lbs to two decimals
#   3. add an entry below
#
# `board:` defaults match the Cul2vate deployed board (8x10 grid, 6" squares).
# Override per-test if Mika prints a different board for the kitchen run.

image_dir: test-images

board:
  squares_x: 8
  squares_y: 10
  square_size_in: 4.0
  dictionary: DICT_6X6_50
  # Auto-detected from Mika's deployed AlphaGraphics 36×44" Dibond print.
  # Pattern: 8×10 grid of 4" squares (32×40" pattern, 2" white border).

images:
  # ── Cul2vate live camera frame ─────────────────────────────────────────────
  - filename: IMG_0739.JPG
    description: |
      Hikvision RTSP feed at Cul2vate dock. Empty staging zone (yellow tape).
      ChArUco board on brick wall. Items in foreground (boxes/bucket) are
      OUTSIDE the staging zone — should report inside_zone=false, weight=null.
    true_weight_lbs: 0.0   # baseline empty-zone control
    is_control: true

  # ── Kitchen test set (Mika populates) ──────────────────────────────────────
  # Add entries like:
  # - filename: kitchen_01_apple.jpg
  #   description: "single Honeycrisp apple in zone"
  #   true_weight_lbs: 0.42
